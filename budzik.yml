# Kopiuj do repozytorium jako .github/workflows/budzik.yml
# Raz dziennie odpytuje bazę, żeby Supabase nie uśpił darmowego projektu.
# Wcześniej dodaj sekrety: Settings → Secrets and variables → Actions → New repository secret
#   SUPABASE_URL  = https://twoj-projekt.supabase.co
#   SUPABASE_KEY  = klucz anon

name: Budzik bazy

on:
  schedule:
    - cron: "17 5 * * *"   # codziennie o 5:17 UTC
  workflow_dispatch:        # i na żądanie, przyciskiem w zakładce Actions

jobs:
  puknij:
    runs-on: ubuntu-latest
    steps:
      - name: Zapytaj o zajętość
        run: |
          kod=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "apikey: ${{ secrets.SUPABASE_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_KEY }}" \
            "${{ secrets.SUPABASE_URL }}/rest/v1/zajetosc?select=slot&limit=1")
          echo "Odpowiedź bazy: $kod"
          if [ "$kod" != "200" ]; then
            echo "Baza nie odpowiada poprawnie — sprawdź projekt w panelu Supabase."
            exit 1
          fi
